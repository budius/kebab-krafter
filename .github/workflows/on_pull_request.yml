name: "On Pull Request"

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    strategy:
      matrix:
        os: [ ubuntu-latest, windows-latest ]
    name: Pull Request Checks
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build - Plugin
        working-directory: kebab-krafter
        env:
          KEBAB_VERSION: 0.0.1-SNAPSHOT
        run: ./gradlew check

      - name: Build - JVM Sample
        working-directory: sample
        env:
          KEBAB_VERSION: 0.0.1-SNAPSHOT
        run: ./gradlew check

      - name: Build - Android Sample
        working-directory: android
        env:
          KEBAB_VERSION: 0.0.1-SNAPSHOT
        # sourceDebugJar was causing issues, so we add checks to the PR to avoid regressions
        # see: https://github.com/budius/kebab-krafter/issues/30
        run: ./gradlew assembleDebug testDebugUnitTest :kraftKebabAndroidLibary:sourceDebugJar

